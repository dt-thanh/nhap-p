name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # docker compose đọc .env cho cả interpolation ${VAR} lẫn env_file.
      # Giá trị dưới đây chỉ dùng trong CI, không phải secret thật.
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|^APP_ENV=.*|APP_ENV=test|' .env
          sed -i 's|^LOG_FORMAT=.*|LOG_FORMAT=json|' .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-password|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=ci-only-not-a-real-secret|' .env
          sed -i 's|^LLM_API_KEY=.*|LLM_API_KEY=test-key|' .env
          # Tắt LangSmith: key placeholder gây 403 spam trong log test
          sed -i 's|^LANGCHAIN_TRACING_V2=.*|LANGCHAIN_TRACING_V2=false|' .env

      - name: Build backend image
        run: docker compose build api

      # RUN_MIGRATIONS=false: lệnh one-off kế thừa env của service api.
      - name: Lint with ruff
        run: docker compose run --rm -e RUN_MIGRATIONS=false api ruff check src/ tests/

      - name: Run tests
        run: docker compose run --rm -e RUN_MIGRATIONS=false api pytest tests/ -v --tb=short

      - name: Verify migrations run cleanly
        run: docker compose run --rm api alembic upgrade head

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Chưa có test runner cho frontend — kiểm tra ở mức build được.
      - name: Build
        working-directory: frontend
        run: npm run build
