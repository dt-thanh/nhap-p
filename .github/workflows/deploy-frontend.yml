# ============================================================
# CI/CD: Tự động build + deploy FRONTEND GỐC lên Cloudflare Pages
# Chạy mỗi khi push code vào nhánh chính (chỉ khi frontend/ đổi).
# Dùng chung 2 secret Cloudflare với workflow CRM — không cần tạo lại.
# ============================================================
name: Deploy Frontend (gốc)

on:
  push:
    branches: 
      branches: 
        - main          # ⬅ đổi thành nhánh chính của bạn (vd: staging)
        - creat_frontend_crm
        - staging
    paths:
      - 'frontend/**'         # chỉ chạy khi có thay đổi trong frontend/
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:          # cho phép bấm chạy tay trên tab Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # 1) Lấy code về
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Cài Node.js 20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3) Cài thư viện
      - name: Install
        working-directory: frontend
        run: npm ci

      # 4) Build ra thư mục dist/
      - name: Build
        working-directory: frontend
        run: npm run build

      # 5) Đẩy dist/ lên Cloudflare Pages (project tên: af-frontend)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=af-frontend --branch=${{ github.ref_name }}
