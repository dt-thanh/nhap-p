name: absorptionforecast

# Handoff credential đồng bộ Mini CRM -> AbsorpIQ (dev-only). File nguồn nằm
# NGOÀI git (`.dev-secrets/`, xem `.gitignore`), do `scripts/dev-reset.sh`
# (qua `python -m scripts.bootstrap_dev --credential-output-file ...`) ghi ra
# — không ai copy tay khoá vào `.env` nữa. Compose mount file này READ-ONLY
# vào `minicrm` tại `/run/secrets/minicrm_sync_api_key` — không lộ qua biến
# môi trường container, không lộ qua `docker inspect`/`docker compose config`.
# `MINICRM_SYNC_API_KEY` (env, dưới service `minicrm`) vẫn còn — là đường
# TƯƠNG THÍCH NGƯỢC cho host-mode/test, `app/config.py::sync_api_key_value`
# ưu tiên file này trước.
secrets:
  minicrm_sync_api_key:
    file: .dev-secrets/minicrm_sync_api_key

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: Dockerfile
  image: absorptionforecast-backend:dev
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-absorption}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./src:/app/src
    - ./alembic:/app/alembic
    - ./data:/app/data
    - uploads:/app/uploads
  restart: unless-stopped

services:
  db:
    # pgvector/pgvector:pg15 — same Postgres 15 as before, plus the `vector`
    # extension needed by migration 0035 (ranking_evidence_document_chunks,
    # docs/ranking/ranking_consultant.md §21.4/§21.10). plain postgres:15-alpine
    # cannot run `CREATE EXTENSION IF NOT EXISTS vector`.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-absorption}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-absorption}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Keycloak: OIDC Identity Provider MẶC ĐỊNH cho dev local -------------
  # Pin phiên bản 26.x cụ thể (KHÔNG dùng :latest). start-dev + import realm p100.
  # Browser mở http://localhost:9090 (cổng host 9090 → 8080 trong container).
  # Backend gọi back-channel qua Docker DNS http://keycloak:8080. Issuer được ghim
  # về http://localhost:9090 bằng `frontendUrl` trong realm JSON — xem
  # docker/keycloak/p100-realm.json và src/services/oidc.py.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      # KC 26: bootstrap admin qua KC_BOOTSTRAP_ADMIN_*. Username có default dev;
      # password BẮT BUỘC lấy từ .env untracked — KHÔNG hard-code password thật.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required in root .env (untracked). Do not commit a real password.}"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "9090:8080"
    volumes:
      # Volume RIÊNG — KHÔNG dùng chung với Postgres của Product/Mini CRM.
      - keycloak_data:/opt/keycloak/data
      # Realm import (read-only). Bind mount ghi đè thư mục import trong volume.
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      # Custom login theme (branded AbsorptionForecast). Đọc lúc container start.
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # Keycloak image KHÔNG có curl/wget. Dùng JDK sẵn có trong image để gọi
      # management health endpoint (cổng 9000, bật bởi KC_HEALTH_ENABLED).
      test:
        - "CMD-SHELL"
        - "echo 'public class H{public static void main(String[] a)throws Exception{System.exit(((java.net.HttpURLConnection)new java.net.URL(a[0]).openConnection()).getResponseCode()==200?0:1);}}' > /tmp/H.java && java /tmp/H.java http://localhost:9000/health/ready"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  api:
    <<: *backend-base
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-absorption}
      REDIS_URL: redis://redis:6379/0
      # SSO qua Keycloak — nhà cung cấp danh tính DUY NHẤT ở runtime (Entra đã
      # bị gỡ khỏi mã nguồn). Giá trị lấy từ `.env` GỐC (xem `.env.example`);
      # rỗng ⇒ `oidc_configured()` sai và route auth trả 503 rõ ràng, KHÔNG có
      # nhà cung cấp nào khác để rơi về. ISSUER = URL browser mở được
      # (localhost:9090); INTERNAL_BASE_URL = Docker DNS cho server-to-server.
      AUTH_PROVIDER: "${AUTH_PROVIDER:-keycloak}"
      OIDC_ISSUER: "${OIDC_ISSUER:-http://localhost:9090/realms/p100}"
      OIDC_INTERNAL_BASE_URL: "${OIDC_INTERNAL_BASE_URL:-http://keycloak:8080/realms/p100}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-absorbiq-client}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-local-dev-absorbiq-secret}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/callback}"
      OIDC_POST_LOGOUT_REDIRECT_URI: "${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5173}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email offline_access}"
      OIDC_ROLE_MAP: "${OIDC_ROLE_MAP:-}"
      OIDC_PROJECT_SCOPE: "${OIDC_PROJECT_SCOPE:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      # Local API only; dashboard_auth also requires APP_ENV=development.
      #
      # CẢNH BÁO (CP4): cờ này trả về admin/ALL cho MỌI request không có
      # `Authorization`. Nó chỉ sống được khi APP_ENV=development, nhưng vẫn là
      # thứ PHẢI tắt ngay khi Keycloak đã cấu hình — nếu không, một request
      # không kèm cookie/token vẫn đi vào bằng quyền admin. Đặt "false" sau khi
      # OIDC_* ở trên đã có giá trị thật.
      # Keycloak giờ cấp auth local THẬT nên bypass mặc định TẮT (đúng như TODO
      # trong dashboard_auth.py: "Remove DEV_AUTH_BYPASS when real local auth
      # exists"). Đặt true chỉ khi cố tình bỏ qua SSO cho một phiên debug.
      DEV_AUTH_BYPASS: "${DEV_AUTH_BYPASS:-false}"
      # CHỈ dùng ở dev/test. entrypoint TỪ CHỐI chạy khi APP_ENV=production —
      # xem docs/runbooks/migrations.md (sự cố quy trình ở Phase 8D). MẶC ĐỊNH
      # TẮT (giống DEV_AUTH_BYPASS ở trên): một file compose bị tái sử dụng ở
      # môi trường khác mà không sửa dòng này trước đây sẽ tự động chạy
      # `alembic upgrade head` mỗi lần container khởi động lại — đặt "true" ở
      # `.env` cục bộ (KHÔNG commit) để bật lại cho dev.
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    # Ghi đè (không thêm vào) danh sách `volumes:` của `x-backend-base`: YAML
    # `<<:` không nối mảng, nên bốn dòng gốc phải liệt lại nguyên văn ở đây.
    # Dòng cuối MỚI: bind mount READ-WRITE duy nhất cho phép `bootstrap_dev.py`
    # (chạy TRONG container qua `docker compose run --rm api ...`) ghi khoá
    # sync credential thô ra HOST — container không thấy `.env` (không mount),
    # nên đây là cách DUY NHẤT nó ghi được ra ngoài. Chỉ `api` có mount này;
    # `worker`/`scheduler` không cần và không nên có quyền ghi vào đây.
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./data:/app/data
      - uploads:/app/uploads
      - ./.dev-secrets:/app/.dev-secrets
    command:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Chạy job dự báo Prophet + LangGraph ngoài request cycle của API.
  worker:
    <<: *backend-base
    command: ["python", "-m", "src.worker"]
    # Tắt HEALTHCHECK kế thừa từ Dockerfile (curl :8000) — worker không chạy web server.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # Chỉ enqueue job theo lịch 02:00 hằng ngày — không tự chạy forecast.
  scheduler:
    <<: *backend-base
    command: ["python", "-m", "src.scheduler"]
    # Tắt HEALTHCHECK kế thừa từ Dockerfile — scheduler không chạy web server.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Vite dev server proxy /api và /ws sang service `api` qua compose network
      VITE_API_PROXY_TARGET: http://api:8000
      # Phase F/G: cổng ghi của FE — Mini CRM, cùng mạng compose.
      VITE_MINICRM_PROXY_TARGET: http://minicrm:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ---- CRM Frontend (Mini CRM UI) ---------------------------------------
  # CP9: service này TRƯỚC ĐÂY KHÔNG CÓ trong compose — `docker compose up` dựng
  # được backend, Product Frontend và Mini CRM API, nhưng giao diện CRM thì phải
  # chạy tay ngoài Docker. Thêm vào đây để một lệnh duy nhất dựng đủ SÁU thành
  # phần của luồng E2E.
  #
  # Cổng 5174, khác 5173 của Product Frontend, để hai UI chạy song song — đúng
  # quy ước đã có trong `minicrm/crm-frontend/vite.config.ts`.
  crm-frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      # Trong container, `localhost` là chính nó — phải dùng TÊN SERVICE.
      VITE_API_PROXY_TARGET: http://minicrm:8000
      # CP6: đích của nút "Xem trong AbsorbIQ". Đây là URL người dùng mở trong
      # TRÌNH DUYỆT, nên là localhost của máy host, KHÔNG phải tên service.
      VITE_PRODUCT_FRONTEND_URL: "${PRODUCT_FRONTEND_URL:-http://localhost:5173}"
      # KHÔNG có VITE_DEV_BEARER_TOKEN ở đây (đã gỡ ở CP1 của hợp nhất SSO).
      # Frontend không còn đọc biến này: token phiên nằm trong cookie HttpOnly
      # `minicrm_session` do backend phát sau vòng OIDC Keycloak, trình duyệt tự
      # đính kèm qua `credentials: "include"` (xem crm-frontend/src/services/
      # api.ts). Thêm lại một dev-token ở đây sẽ (1) là biến chết vì FE bỏ qua,
      # (2) buộc MINICRM_AUTH_ADMIN_TOKEN thành bắt buộc cho service FE một cách
      # vô nghĩa, (3) đi ngược mục tiêu Keycloak-only. Muốn bật lối token tĩnh cho
      # dev thì đặt MINICRM_LEGACY_TOKEN_AUTH_ENABLED=true ở service `minicrm`
      # (opt-in tường minh, mặc định tắt — KHÔNG dùng cho production).
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./minicrm/crm-frontend:/app
      - crm_frontend_node_modules:/app/node_modules
    depends_on:
      minicrm:
        condition: service_started
    restart: unless-stopped

  # ---- Mini CRM: hệ nguồn TỔNG HỢP, HOÀN TOÀN TÁCH KHỎI BACKEND ----------
  #
  # Database riêng, volume riêng, cổng riêng, image riêng, lịch sử Alembic riêng.
  # Hai hệ thống chỉ gặp nhau ở ĐÚNG một chỗ: Mini CRM POST sang `api`. Backend
  # không có đường nào gọi ngược lại, và không được thêm.
  #
  # Đây KHÔNG phải CRM của khách hàng. Nó do chính dự án này viết, nên nó không
  # chứng minh được khả năng tương thích với bất kỳ hệ nguồn thật nào.
  minicrm_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${MINICRM_POSTGRES_USER:-minicrm}
      POSTGRES_PASSWORD: ${MINICRM_POSTGRES_PASSWORD:-minicrm}
      POSTGRES_DB: ${MINICRM_POSTGRES_DB:-minicrm}
    ports:
      # Cổng KHÁC backend (5432) — gõ nhầm cổng không được phép trỏ vào nhầm hệ.
      - "5434:5432"
    volumes:
      - minicrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${MINICRM_POSTGRES_USER:-minicrm} -d ${MINICRM_POSTGRES_DB:-minicrm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minicrm:
    build:
      context: ./minicrm
      dockerfile: Dockerfile
    image: minicrm-synthetic:dev
    # Nguồn giá trị CHÍNH: đúng file mà chế độ uvicorn trực tiếp cũng đọc
    # (`minicrm/app/config.py`, `env_file=".env"` phân giải theo CWD = `minicrm/`
    # khi chạy trực tiếp). Dùng CHUNG một file cho cả hai chế độ nghĩa là một dev
    # điền `minicrm/.env` một lần là chạy được ở CẢ HAI — không còn "cấu hình chỉ
    # sống ở chế độ này mà biến mất ở chế độ kia".
    #
    # LỖI ĐÃ SỬA: bản trước KHÔNG có `env_file` này — mọi biến bí mật
    # (MINICRM_AUTH_*, MINICRM_SYNC_API_KEY, MINICRM_PROJECT_ID) chỉ tồn tại
    # trong `minicrm/.env` và KHÔNG BAO GIỜ tới container, vì khối `environment:`
    # dưới đây (nội suy từ `.env` GỐC, nơi các biến đó không có mặt) đã GHI ĐÈ
    # chúng bằng `${VAR:-}` → chuỗi rỗng, mỗi lần `up`/`recreate`. `environment:`
    # LUÔN thắng `env_file:` khi cùng khoá (quy tắc precedence của Compose) — nên
    # việc sửa đúng là: chỉ giữ lại trong `environment:` NHỮNG GIÁ TRỊ THẬT SỰ
    # PHẢI KHÁC giữa hai chế độ (kết nối mạng Docker + auto-migrate dev), và bỏ
    # hẳn mọi biến bí mật khỏi `environment:` để chúng không còn gì để ghi đè.
    env_file:
      - ./minicrm/.env
    environment:
      # Ba biến dưới đây CỐ Ý nằm trong `environment:` (không phải `env_file`) vì
      # giá trị của chúng THẬT SỰ khác giữa hai chế độ chạy — `minicrm/.env` giữ
      # bản host-mode (`localhost:5433`/`localhost:8000`), ở đây ghi đè bằng bản
      # Docker-mode. TIỀN TỐ MINICRM_ cho MỌI biến Mini CRM: không có nó, Mini CRM
      # sẽ đọc trúng DATABASE_URL của backend và migrate cây schema của mình lên
      # database của backend — trộn hai lịch sử Alembic làm một.
      MINICRM_DATABASE_URL: postgresql+asyncpg://${MINICRM_POSTGRES_USER:-minicrm}:${MINICRM_POSTGRES_PASSWORD:-minicrm}@minicrm_db:5432/${MINICRM_POSTGRES_DB:-minicrm}
      # TÊN SERVICE của Compose, không phải localhost: trong container,
      # `localhost` là chính Mini CRM.
      MINICRM_SYNC_BASE_URL: http://api:8000
      MINICRM_REDIS_URL: redis://redis:6379/0
      # Chỉ dev. Production migrate bằng lệnh tường minh, giống backend
      # (`minicrm/.env` giữ "false" cho chế độ uvicorn trực tiếp — migrate tay).
      MINICRM_RUN_MIGRATIONS: "true"
      # Keycloak/OIDC generic cho Mini CRM (docker-mode). CỐ Ý ở `environment:`
      # (không phải env_file) vì INTERNAL_BASE_URL khác giữa host-mode
      # (localhost:9090) và docker-mode (keycloak:8080) — cùng lý do với
      # MINICRM_DATABASE_URL ở trên. ISSUER là host CÔNG KHAI browser mở được.
      MINICRM_OIDC_ISSUER: "${MINICRM_OIDC_ISSUER:-http://localhost:9090/realms/p100}"
      MINICRM_OIDC_INTERNAL_BASE_URL: "${MINICRM_OIDC_INTERNAL_BASE_URL:-http://keycloak:8080/realms/p100}"
      MINICRM_OIDC_CLIENT_ID: "${MINICRM_OIDC_CLIENT_ID:-minicrm-client}"
      MINICRM_OIDC_CLIENT_SECRET: "${MINICRM_OIDC_CLIENT_SECRET:-local-dev-minicrm-secret}"
      MINICRM_OIDC_REDIRECT_URI: "${MINICRM_OIDC_REDIRECT_URI:-http://localhost:8100/auth/callback}"
      MINICRM_OIDC_POST_LOGOUT_REDIRECT_URI: "${MINICRM_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5174/login}"
      MINICRM_OIDC_SCOPES: "${MINICRM_OIDC_SCOPES:-openid profile email offline_access}"
      # SESSION_SECRET cho Mini CRM đến từ minicrm/.env (MINICRM_SESSION_SECRET).
      # --- MINICRM_SYNC_API_KEY: nay là TƯƠNG THÍCH NGƯỢC, không còn bắt buộc.
      # Đường CHÍNH là `secrets:` bên dưới (`/run/secrets/minicrm_sync_api_key`,
      # `app/config.py::sync_api_key_value` ưu tiên đọc nó trước) — file đó do
      # `scripts/dev-reset.sh` ghi tự động, không ai còn phải dán khoá vào
      # `.env` GỐC tay nữa. Biến này CHỈ còn ý nghĩa cho chế độ chạy KHÔNG qua
      # Compose secrets (host-mode trực tiếp, một số test) — để trống ở
      # `.env` GỐC không còn làm `docker compose config`/`up` thất bại (trước
      # đây `${VAR:?...}` bắt buộc); `sync_api_key_value` tự báo lỗi RÕ RÀNG
      # lúc gọi nếu CẢ hai nguồn đều thiếu, thay vì Compose chặn sớm.
      MINICRM_SYNC_API_KEY: "${MINICRM_SYNC_API_KEY:-}"
      MINICRM_AUTH_ADMIN_TOKEN: "${MINICRM_AUTH_ADMIN_TOKEN:?MINICRM_AUTH_ADMIN_TOKEN is required in root .env for Docker mode. Copy the same value used in minicrm/.env}"
    # Mount READ-ONLY (mặc định của Compose `secrets:`) — Mini CRM chỉ ĐỌC
    # khoá, không bao giờ ghi. Target path cố định theo tên secret:
    # `/run/secrets/minicrm_sync_api_key`, khớp `app/config.py::SYNC_API_KEY_SECRET_FILE`.
    secrets:
      - minicrm_sync_api_key
    volumes:
      - ./minicrm/app:/app/app
      - ./minicrm/alembic:/app/alembic
    ports:
      - "8100:8000"
    depends_on:
      minicrm_db:
        condition: service_healthy
      # Backend phải sống trước khi Mini CRM có thể đẩy sang.
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  crm_frontend_node_modules:
  pgdata:
  uploads:
  # Volume RIÊNG. Dùng chung volume là dùng chung database.
  minicrm_pgdata:
  # Keycloak data — volume RIÊNG, KHÔNG dùng chung với Postgres của Product/Mini
