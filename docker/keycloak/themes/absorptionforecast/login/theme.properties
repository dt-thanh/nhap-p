### AbsorptionForecast / P-100 login theme
# Kế thừa toàn bộ template đang chạy tốt của keycloak.v2 (không override .ftl để
# tránh rủi ro render). Chỉ NẠP THÊM css/custom.css chồng lên css/styles.css gốc.
# Nếu custom.css lỗi -> vẫn còn styles.css gốc, trang login KHÔNG hỏng.
parent=keycloak.v2
import=common/keycloak

# styles.css = base của keycloak.v2 (resolve ngược lên theme cha); custom.css = của mình
styles=css/styles.css css/custom.css

# Bật đa ngôn ngữ, mặc định tiếng Việt (Keycloak có sẵn bản dịch vi)
locales=vi,en
