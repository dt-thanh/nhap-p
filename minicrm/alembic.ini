[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url nạp từ MINICRM_DATABASE_URL trong alembic/env.py.
# KHÔNG dùng DATABASE_URL: đó là biến của backend, và đọc trúng nó nghĩa là
# migrate schema của Mini CRM lên database của backend.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
